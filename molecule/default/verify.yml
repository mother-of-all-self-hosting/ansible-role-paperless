---
- name: Verify Paperless-ngx systemd service
  hosts: all
  become: true
  gather_facts: false

  vars:
    paperless_verify_units:
      - paperless.service
      - valkey.service

  tasks:
    - name: Verify that Paperless-ngx works
      block:
        - name: Wait for the Paperless-ngx systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: paperless_services
          until: paperless_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ paperless_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Paperless-ngx systemd services are active
          ansible.builtin.assert:
            that: paperless_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(paperless_verify_units | zip(paperless_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Paperless-ngx systemd services log for debugging
          when: paperless_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ paperless_verify_units }}"

        - name: Wait for Paperless-ngx HTTP endpoint to respond (up to 10m)
          ansible.builtin.uri:
            url: "http://localhost:3000/"
            method: GET
            status_code: [200, 302]
            follow_redirects: none
          register: paperless_endpoint
          until: paperless_endpoint.status in [200, 302]
          retries: 120
          delay: 5

        - name: Assert Paperless-ngx HTTP endpoint responds
          ansible.builtin.assert:
            that: paperless_endpoint.status in [200, 302]
            fail_msg: "Paperless-ngx did not respond as expected ({{ paperless_endpoint.status | default('no response') }})"
            success_msg: "Paperless-ngx responded with {{ paperless_endpoint.status }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "paperless_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: paperless_restarts_before
              loop: "{{ paperless_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: paperless_restarts_after
              loop: "{{ paperless_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - paperless_restarts_after.results | map(attribute='status.NRestarts') | list == paperless_restarts_before.results | map(attribute='status.NRestarts') | list
                  - paperless_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in paperless_verify_units | zip(paperless_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in paperless_verify_units | zip(paperless_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in paperless_verify_units | zip(paperless_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Paperless-ngx verification summary
          ansible.builtin.debug:
            msg:
              - "Paperless-ngx systemd: {% for unit, state in paperless_verify_units | zip(paperless_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Paperless-ngx restarts: {% for unit, restarts in paperless_verify_units | zip(paperless_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Paperless-ngx HTTP: {{ paperless_endpoint.status }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Paperless-ngx systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=paperless.service
          register: paperless_service_log
          changed_when: false

        - name: Show the Paperless-ngx systemd service log
          ansible.builtin.debug:
            var: paperless_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Paperless-ngx verification failed. The systemd service log is printed above."
