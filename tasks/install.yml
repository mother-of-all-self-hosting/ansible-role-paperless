---
- name: Ensure Paperless-ngx paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: "{{ paperless_uid }}"
    group: "{{ paperless_gid }}"
  with_items:
    - "{{ paperless_base_path }}"
    - "{{ paperless_media_path }}"
    - "{{ paperless_data_path }}"
    - "{{ paperless_export_path }}"
    - "{{ paperless_consume_path }}"

- name: Ensure Paperless-ngx support files installed
  when: item.when | bool
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0640"
    owner: "{{ paperless_uid }}"
    group: "{{ paperless_gid }}"
  with_items:
    - src: "{{ role_path }}/templates/env.j2"
      dest: "{{ paperless_base_path }}/env"
      when: true
    - src: "{{ role_path }}/templates/labels.j2"
      dest: "{{ paperless_base_path }}/labels"
      when: true
  register: paperless_support_files_result

# The bundled Apache Tika Server and Gotenberg installations have been removed
# from this role in favor of external instances (e.g. the MASH tika and
# gotenberg roles). Clean up what older versions of this role may have set up.
- name: Ensure legacy bundled Tika/Gotenberg systemd services are stopped and removed
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/remove_service.yml"
  with_items:
    - service: "{{ paperless_identifier }}-tika.service"
      path: "{{ devture_systemd_docker_base_systemd_path }}/{{ paperless_identifier }}-tika.service"
    - service: "{{ paperless_identifier }}-gotenberg.service"
      path: "{{ devture_systemd_docker_base_systemd_path }}/{{ paperless_identifier }}-gotenberg.service"

- name: Ensure legacy bundled Tika/Gotenberg support files do not exist
  ansible.builtin.file:
    path: "{{ paperless_base_path }}/{{ item }}"
    state: absent
  with_items:
    - tika-env
    - tika-labels
    - gotenberg-env
    - gotenberg-labels

- name: Ensure Paperless-ngx container image is pulled
  when: item.when | bool
  community.docker.docker_image_pull:
    name: "{{ item.image }}"
    pull: always
  with_items:
    - image: "{{ paperless_container_image }}"
      when: true
  register: paperless_container_images_pull_result
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: paperless_container_images_pull_result is not failed

- name: Ensure Paperless-ngx container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ paperless_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: paperless_network_creation_result

- name: Ensure Paperless-ngx container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ paperless_container_network }}
  register: paperless_network_creation_result
  changed_when: paperless_network_creation_result.rc == 0
  failed_when: paperless_network_creation_result.rc != 0 and 'already exists' not in paperless_network_creation_result.stderr

- name: Ensure Paperless-ngx systemd services are present
  when: item.when | bool
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  with_items:
    - src: "{{ role_path }}/templates/systemd/paperless.service.j2"
      dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ paperless_identifier }}.service"
      when: true
  register: paperless_systemd_services_result

- name: Determine whether Actual needs a restart
  ansible.builtin.set_fact:
    paperless_restart_necessary: >-
      {{
        paperless_support_files_result.changed | default(false)
        or paperless_systemd_services_result.changed | default(false)
        or paperless_container_images_pull_result.changed | default(false)
      }}
